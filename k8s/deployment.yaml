apiVersion: apps/v1                    # Kubernetes Apps API 버전 지정
kind: Deployment                       # Deployment 리소스 지정
metadata:                              # Deployment 메타데이터 영역
  name: cicd-web                        # Deployment 이름 지정
  namespace: cicd-lab                  # 배포할 Namespace 지정
spec:                                  # Deployment 상세 설정 영역
  replicas: 2                          # 생성할 Pod 수 지정
  selector:                            # 관리할 Pod 선택 조건 지정
    matchLabels:                        # Label 기반 Pod 선택
      app: cicd-web                     # app=cicd-web Label 선택
  template:                            # 생성할 Pod Template 정의
    metadata:                          # Pod 메타데이터 영역
      labels:                           # Pod Label 설정
        app: cicd-web                   # Pod 식별용 Label 지정
    spec:                              # Pod 상세 설정 영역
      containers:                       # 컨테이너 설정 영역
        - name: nginx                   # 컨테이너 이름 지정
          image: nginx:1.27-alpine      # 사용할 Docker Image 지정
          ports:                        # 컨테이너 Port 설정
            - containerPort: 80         # HTTP 서비스 Port 지정
          resources:                    # 컨테이너 Resource 설정
            requests:                   # 최소 보장 Resource 설정
              cpu: 100m                 # CPU 요청량 지정
              memory: 64Mi              # Memory 요청량 지정
            limits:                     # 최대 사용 Resource 설정
              cpu: 500m                 # CPU 최대 사용량 지정
              memory: 128Mi             # Memory 최대 사용량 지정
